name: iOS 27 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Official image inventory checked 2026-10-07:
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    # Each partition runs on a fresh hosted simulator; their exact native IDs
    # must cover the complete suite. Bounded per-case XCTest limits are enforced.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        partition: [a, b]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SIMULATOR_OS: "27.0"
      SIMULATOR_FAMILY: ${{ matrix.device }}
      VERIFICATION_PARTITION: ${{ matrix.partition }}
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate native coverage checker
        run: python3 -m unittest discover -s scripts/tests
      - name: Selected native test partition
        run: scripts/verify-ios.sh
      - name: Preserve test results, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-${{ matrix.device }}-${{ matrix.partition }}-${{ github.sha }}
          path: |
            artifacts/Tests.xcresult
            artifacts/DerivedData/Logs/Test/*.xcresult
            artifacts/attachments
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.log
            artifacts/*.mp4
          if-no-files-found: warn
          retention-days: 14
