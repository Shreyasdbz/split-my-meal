name: iOS 27 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Official image inventory checked 2026-10-07:
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    # The complete iPad suite outgrew 50 minutes on a slower hosted run.
    # Individual XCTest limits remain 240 seconds (420 for two long journeys).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SIMULATOR_OS: "27.0"
      SIMULATOR_FAMILY: ${{ matrix.device }}
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests and complete UI journeys
        run: scripts/verify-ios.sh
      - name: Preserve test results, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-${{ matrix.device }}-${{ github.sha }}
          path: |
            artifacts/Tests.xcresult
            artifacts/attachments
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.log
            artifacts/*.mp4
          if-no-files-found: warn
          retention-days: 14
